# 依赖库中心 · docker compose
#
# 只编排两个应用容器：manage（管理端）与 portal（下载页）。
# MinIO 不在这个文件里 —— 它已经是常驻服务，compose 通过 MINIO_ENDPOINT 去连。
# 需要把 MinIO 也一起起的话，看文件末尾的注释片段。
#
# 需要 docker compose v2（`docker compose` 而非 `docker-compose`）：
# portal 的凭据用了嵌套默认值 ${A:-${B}}，v1 解析不了。
#
# 变量来自同目录的 .env（复制 deploy.env.example 改名即可）：
#   cp deploy.env.example .env
#   docker compose up -d --build
#
# 常用：
#   docker compose ps                    看状态
#   docker compose logs -f manage        看日志
#   docker compose up -d --build manage  只重建管理端
#   docker compose down                  停掉（不动 MinIO 的数据）

name: dep-center

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  manage:
    build:
      context: ./manage
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: dep-manage:latest
    container_name: dep-manage
    restart: unless-stopped
    ports:
      - "${MANAGE_PORT:-8889}:8788"
    # 容器里的 127.0.0.1 是容器自己。MinIO 跑在宿主机时用 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      # 必填：不填会回落到代码里的默认账号/公开的会话密钥
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 必填，写进 .env}
      ADMIN_NAME: ${ADMIN_NAME:-平台管理员}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 必填，openssl rand -hex 32}
      # 必填：管理端要读写，还需要 CreateBucket 才能自动建桶
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 必填}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必填}
      MINIO_BUCKET: ${MINIO_BUCKET:-dep-artifacts}
      MINIO_PREFIX: ${MINIO_PREFIX:-}
      MINIO_AUTO_CREATE_BUCKET: ${MINIO_AUTO_CREATE_BUCKET:-true}
      # 分片参数：DEP_PART_SIZE 不能低于 5 MiB，否则合并会被 MinIO 拒绝
      DEP_PART_SIZE: ${DEP_PART_SIZE:-8388608}
      DEP_MAX_FILE_BYTES: ${DEP_MAX_FILE_BYTES:-21474836480}
    logging: *default-logging

  portal:
    build:
      context: ./portal
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: dep-portal:latest
    container_name: dep-portal
    restart: unless-stopped
    # 等 manage 健康再起：先由 manage 建桶，portal 才不会读到空目录
    depends_on:
      manage:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT:-8888}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      # 必须与 manage 指向同一个桶、同一个前缀
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # 只读凭据。现在和 manage 用同一套也行，生产建议单独建：
      #   s3:GetObject on arn:aws:s3:::dep-artifacts/deps/*
      #   s3:GetObject on arn:aws:s3:::dep-artifacts/meta/deps/*
      MINIO_ACCESS_KEY: ${PORTAL_MINIO_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      MINIO_SECRET_KEY: ${PORTAL_MINIO_SECRET_KEY:-${MINIO_SECRET_KEY}}
      MINIO_BUCKET: ${MINIO_BUCKET:-dep-artifacts}
      MINIO_PREFIX: ${MINIO_PREFIX:-}
    logging: *default-logging

# ---------------------------------------------------------------------------
